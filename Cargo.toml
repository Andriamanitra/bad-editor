[package]
name = "bad-editor"
version = "0.1.0"
license = "MIT"
edition = "2024"
rust-version = "1.87"

[[bin]]
name = "bad"
path = "src/main.rs"

[dependencies]
clap = "4.5.42"
crossterm = { version = "0.29.0", features = ["osc52"] }
directories = "6.0.0"
duct = "1.1.1"
ec4rs = "1.2.0"
grok = { version = "2.4.0", features = ["regex"], default-features = false }
libc = "0.2.175"
nu-ansi-term = "0.50.1"
radix_trie = "0.2.1"
reedline = { git = "https://github.com/Andriamanitra/reedline", branch = "no-crlf" }
ropey = { version = "1.6.1", features = ["unicode_lines"] }
shlex = "1.3.0"
syntect = { git = "https://github.com/trishume/syntect", rev = "4efbec173db6ea83caaf7a34994cb7e4d038a13e" }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
unicode_names2 = "4.0.0"

[dev-dependencies]
rstest = "0.26.1"

[build-dependencies]
syntect = { git = "https://github.com/trishume/syntect", rev = "4efbec173db6ea83caaf7a34994cb7e4d038a13e" }
ec4rs = "1.2.0"

[profile.dev.build-override]
# Enabling optimizations for build.rs seems to improve compile times
# significantly (24s -> 15s for clean debug build on my machine).
# I think it's because syntect without optimizations is really slow
# to build the syntax set.
opt-level = 3

[profile.dev]
# App::load_runtime_syntaxes would take like 15 seconds with opt-level=0!
# opt-level=1 doesn't seem to affect compile times much but it fixes the
# extremely slow loading of runtime syntaxes.
opt-level = 1

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = "debuginfo"
